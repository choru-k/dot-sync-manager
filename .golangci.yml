version: 2

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt          # Checks Go code formatting
    - goimports      # Checks import ordering and formatting

linters:
  enable:
    - govet          # Reports suspicious constructs
    - misspell       # Finds commonly misspelled English words
    - ineffassign    # Detects ineffectual assignments
  # Disabled in pre-commit to allow faster commits, run in CI instead
  disable:
    - errcheck       # Too strict for pre-commit
    - revive         # Stylistic, better in CI
    - staticcheck    # Some issues require manual review
    - whitespace     # Handled by gofmt

formatters-settings:
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: github.com/choru-k/dot-sync-manager
  
linters-settings:
  revive:
    confidence: 0.8

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # Exclude some linters from running on tests files
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
