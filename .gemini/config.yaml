# Gemini Code Assist Configuration
# This file customizes how Gemini reviews code in this repository

# Style guide configuration
style_guide: ".gemini/styleguide.md"

# Review settings
review:
  # Focus areas for code review
  focus:
    - path_handling
    - error_handling
    - validation_patterns
    - test_quality
    - code_duplication
  
  # Severity levels to report
  severity:
    - critical
    - high
    - medium
  
  # Skip low priority suggestions unless specifically requested
  skip_low_priority: false

# File patterns to review
include:
  - "**/*.go"
  - "**/*_test.go"

# File patterns to skip
exclude:
  - "vendor/**"
  - "**/testdata/**"
  - "**/*.pb.go"
  - "**/*_generated.go"

# Project-specific rules
custom_rules:
  - name: "path_expansion"
    description: "All user-provided paths must be expanded via expandPaths() method"
    pattern: "ExpandPath"
    enabled: true
  
  - name: "validation_mutations"
    description: "Validate() methods should never mutate state"
    pattern: "func.*Validate.*error"
    enabled: true
  
  - name: "test_cleanup"
    description: "Tests should use t.Cleanup not defer for teardown"
    pattern: "defer.*Setenv"
    enabled: true

# Language and framework versions
language:
  go:
    version: "1.23"
    modules: true

# Review tone
tone: "constructive"

# Provide code suggestions
suggestions: true

# Include examples in feedback
examples: true
