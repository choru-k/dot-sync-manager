name: Claude Code

# Trigger Claude Code only when someone comments "@claude"
# This enables manual assistance on demand rather than automatic triggering
#
# Usage:
# - "@claude review" → Uses comprehensive code review template
# - "@claude <custom instructions>" → Uses your custom prompt
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # Triggered by commenting "@claude" on PRs, issues, or reviews
        # Uses review prompt for "@claude review", otherwise uses comment body
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Use review prompt for "@claude review", custom prompt for other @claude commands
          prompt: |
            ${{ if contains(github.event.comment.body, '@claude review') || contains(github.event.review.body, '@claude review') || contains(github.event.issue.body, '@claude review') || contains(github.event.issue.title, '@claude review') }}
            REPO: ${{ github.repository }}
            ISSUE/PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` or `gh issue comment` with your Bash tool to leave your review as a comment.
            ${{ else }}
            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
            ${{ end }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

