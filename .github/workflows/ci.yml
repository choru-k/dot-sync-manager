name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.23-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.23-

    - name: Install dependencies
      run: make deps

    - name: Install golangci-lint (CI specific)
      run: |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "Installing golangci-lint (latest v2.x)..."
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        else
          echo "golangci-lint already installed: $(golangci-lint version)"
        fi

    - name: Run code quality checks
      run: make lint

    - name: Run unit tests
      run: make test-unit

    - name: Run integration tests
      run: make test-integration

  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('test/Dockerfile.test', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Make scripts executable
      run: |
        chmod +x test/scripts/*.sh
        chmod +x test/fixtures/ssh_keys/*.sh

    - name: Run E2E tests
      run: make test-all

    - name: Upload E2E test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-reports
        path: /tmp/dsm-e2e-report-*.txt
        retention-days: 7

    - name: Cleanup test environment
      if: always()
      run: |
        ./test/scripts/cleanup.sh force || true

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.23-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.23-

    - name: Install dependencies
      run: make deps

    - name: Build
      run: make build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dsm-linux
        path: bin/dsm

  
