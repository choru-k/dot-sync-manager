# Pre-commit hooks for DSM (Dotfile Sync Manager)
# Install with: pre-commit install
# or: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt
        language: system
        args: [-w, ./...]
        pass_filenames: false
        files: \.go$

      - id: go-imports
        name: go imports
        entry: goimports
        language: system
        args: [-w, ./...]
        pass_filenames: false
        files: \.go$

      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        args: [./...]
        pass_filenames: false
        files: \.go$

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        args: [--timeout=5m]
        pass_filenames: false
        files: \.go$

      - id: unit-tests
        name: unit tests
        entry: make
        args: [test-unit]
        language: system
        pass_filenames: false
        files: \.go$

      - id: integration-tests
        name: integration tests
        entry: make
        args: [test-integration]
        language: system
        pass_filenames: false
        files: \.go|

      - id: build-check
        name: build check
        entry: make
        args: [build]
        language: system
        pass_filenames: false
        files: \.go|go\.mod|go\.sum

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: trailing whitespace
      - id: end-of-file-fixer
        name: end of file fixer
      - id: check-yaml
        name: check yaml
      - id: check-toml
        name: check toml
      - id: check-json
        name: check json
      - id: check-merge-conflict
        name: check merge conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.0.4
    hooks:
      - id: detect-secrets
        name: detect secrets
        exclude: '^\.github/workflows/.*\.yml$'